name: Cleanup Old Workflow Runs # 오래된 워크플로 실행 기록 정리

on:
  workflow_dispatch: # 수동으로 워크플로를 실행할 수 있도록 허용
  schedule:
    # 매일 자정 UTC에 실행. (매주 일요일 실행은 중복되므로 하나만 유지하는 것이 효율적입니다.)
    - cron: '0 0 * * *' 

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest # 최신 Ubuntu 환경에서 실행
    permissions:
      actions: write # 워크플로 실행 기록 삭제 권한
      contents: read # 저장소 내용 읽기 권한
      
    steps:
      # peter-evans/delete-workflow-runs 액션 사용 (가장 권장되는 방법)
      - name: Delete old workflow runs
        # 최신 안정 버전인 v3 사용 권장
        uses: peter-evans/delete-workflow-runs@v3 
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 5 # 최소 5개의 최신 실행 기록 유지
          days_old: 7 # 7일 이상된 실행 기록 삭제
          # 현재 워크플로(cleanup.yml)는 삭제 대상에서 제외
          exclude_workflows: "cleanup.yml" 
