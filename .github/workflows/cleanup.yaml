name: Cleanup Old Workflow Runs # 오래된 워크플로 실행 기록 정리

on:
  workflow_dispatch: # 수동으로 워크플로를 실행할 수 있도록 허용
  schedule:
    - cron: '0 0 * * 0' # 매주 일요일 UTC 00:00에 실행되도록 스케줄 설정

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest # 최신 Ubuntu 환경에서 실행
    permissions:
      actions: write # 이 워크플로가 워크플로 실행 기록을 삭제할 수 있도록 'actions: write' 권한 부여 (필수)
    steps:
      - name: Delete old workflow runs # 오래된 워크플로 실행 기록 삭제 단계
        uses: peter-evans/delete-workflow-runs@v3 # peter-evans/delete-workflow-runs 액션의 v3 버전 사용
        with:
          repository: ${{ github.repository }} # 현재 GitHub 저장소를 대상으로 지정
          token: ${{ secrets.GITHUB_TOKEN }} # GitHub Actions에서 자동으로 제공하는 기본 토큰 사용
          keep_minimum_runs: 5 # 최소 5개의 최신 워크플로 실행 기록은 유지
          days_old: 7 # 7일보다 오래된 워크플로 실행 기록을 삭제
