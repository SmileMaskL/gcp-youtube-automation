name: Cleanup Old Workflow Runs # 오래된 워크플로 실행 기록 정리

on:
  workflow_dispatch: # 수동으로 워크플로를 실행할 수 있도록 허용
  schedule:
    # 매일 자정 UTC에 실행.
    - cron: '0 0 * * *' 

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest # 최신 Ubuntu 환경에서 실행
    permissions:
      actions: write # 워크플로 실행 기록 삭제 권한
      contents: read # 저장소 내용 읽기 권한
      
    steps:
      # 1. 저장소 체크아웃 (기본 액션이 잘 작동하는지 확인)
      # 이 스텝이 실패한다면, 러너의 기본적인 동작에 문제가 있을 가능성이 큽니다.
      - name: Checkout repository for basic action test
        uses: actions/checkout@v4

      # 2. GitHub API 연결 테스트 (네트워크 문제 확인)
      # 이 스텝이 실패한다면, 러너가 GitHub Actions 액션을 다운로드하는 데 필요한 네트워크 연결에 문제가 있을 수 있습니다.
      - name: Test GitHub API Connectivity for Actions
        run: |
          echo "Testing connectivity to api.github.com for action fetching..."
          curl -v https://api.github.com/repos/peter-evans/delete-workflow-runs/contents/action.yml
          if [ $? -ne 0 ]; then
            echo "Error: Failed to connect to GitHub API to fetch action metadata. This might be a network issue."
            exit 1
          else
            echo "Successfully connected to GitHub API and fetched action metadata."
          fi

      # 3. peter-evans/delete-workflow-runs 액션 사용
      # 위의 진단 스텝들이 성공했는데도 이 스텝에서 에러가 발생한다면,
      # 액션 자체의 일시적인 문제이거나 GitHub Actions의 특정 캐싱 문제일 수 있습니다.
      - name: Delete old workflow runs
        uses: peter-evans/delete-workflow-runs@v5 
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 5 # 최소 5개의 최신 실행 기록 유지
          days_old: 7 # 7일 이상된 실행 기록 삭제
          exclude_workflows: "cleanup.yml" # 현재 워크플로는 삭제 대상에서 제외
