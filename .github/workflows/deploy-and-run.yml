  #   needs: build-and-deploy
  #   runs-on: ubuntu-latest
  #   outputs:
  #     service_url: ${{ env.SERVICE_URL }}
  #   steps:
  #     - name: '서비스 URL 가져오기'
  #       run: |
  #         echo "서비스 URL은: ${{ env.SERVICE_URL }}"
