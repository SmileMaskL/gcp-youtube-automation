# .github/workflows/deploy-and-run.yml
name: Deploy to Cloud Run and Run Daily Upload

on:
  push:
    branches:
      - main
    paths: # src 폴더 안의 파일이 변경될 때만 트리거
      - 'src/**'
      - '.github/workflows/deploy-and-run.yml' # 이 파일 자체도 변경 시 트리거
  workflow_dispatch: # GitHub UI에서 수동 실행 가능하도록
  
env:
  PROJECT_ID: youtube-fully-automated # ✨ 여러분의 GCP 프로젝트 ID로 변경! ✨
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  # Cloud Run 서비스 URL (배포 후 알 수 있지만, 초기에는 비워두거나 예상 URL로 설정)
  # 이 변수는 Workload Identity Provider의 audience로 사용됩니다.
  CLOUD_RUN_URL: https://youtube-shorts-automation-${{ vars.GCP_PROJECT_NUMBER }}.us-central1.run.app # ✨ 중요: Cloud Run 서비스의 실제 URL 패턴 ✨
  # 환경 변수는 GitHub Secrets에서 가져옵니다.
  # SECRET_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # 이 변수는 app.py에서 직접 사용되지 않음
  SECRET_GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
  SECRET_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  SECRET_ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
  SECRET_OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
  SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  SECRET_NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
  SECRET_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  SECRET_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  SECRET_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  SECRET_YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation을 위해 필요
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- ✨ 핵심 수정 1: Workload Identity Provider Audience 설정 ✨ ---
      # 이제 audience를 실제 Cloud Run 서비스 URL로 설정합니다.
      # PROJECT_NUMBER는 GitHub Environment 변수로 미리 설정되어 있어야 합니다.
      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
          # ⭐ audience를 동적으로 설정합니다.
          # Cloud Run 서비스가 처음 생성될 때는 URL을 알 수 없으므로, 패턴으로 제공합니다.
          # GCP_PROJECT_NUMBER는 GCP 프로젝트 ID가 아닌 프로젝트 '번호'입니다.
          # GitHub 저장소의 Settings -> Environments -> production -> Repository secrets 에
          # GCP_PROJECT_NUMBER 변수를 추가하고 여러분의 GCP 프로젝트 번호(숫자로 된 ID)를 입력해야 합니다.
          audience: ${{ env.CLOUD_RUN_URL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./src \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }} \
            --timeout 900s \
            # --- ✨ 핵심 수정 2: 모든 환경 변수를 --set-env-vars로 전달 ✨ ---
            # app.py에서 필요로 하는 모든 환경 변수를 여기에 명시적으로 전달합니다.
            --set-env-vars \
              GCP_PROJECT_ID=${{ env.PROJECT_ID }},\
              GCP_BUCKET_NAME=${{ env.SECRET_GCS_BUCKET_NAME }},\
              ELEVENLABS_API_KEY=${{ env.SECRET_ELEVENLABS_API_KEY }},\
              ELEVENLABS_VOICE_ID=${{ env.SECRET_ELEVENLABS_VOICE_ID }},\
              OPENAI_API_KEYS="${{ env.SECRET_OPENAI_API_KEYS }}",\
              GEMINI_API_KEY=${{ env.SECRET_GEMINI_API_KEY }},\
              NEWSAPI_API_KEY=${{ env.SECRET_NEWSAPI_API_KEY }},\
              PEXELS_API_KEY=${{ env.SECRET_PEXELS_API_KEY }},\
              YOUTUBE_CLIENT_ID=${{ env.SECRET_YOUTUBE_CLIENT_ID }},\
              YOUTUBE_CLIENT_SECRET=${{ env.SECRET_YOUTUBE_CLIENT_SECRET }},\
              YOUTUBE_REFRESH_TOKEN=${{ env.SECRET_YOUTUBE_REFRESH_TOKEN }}
        # --- ✨ 중요: 배포된 서비스 URL을 다음 Job으로 전달 ✨ ---
        # deploy_url을 출력하여 다음 작업에서 사용할 수 있도록 합니다.
        # 이 deploy_url은 실제 Cloud Run 서비스 URL입니다.
        env:
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }} # GitHub Secrets에서 가져와야 함

      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "Cloud Run Service URL: $SERVICE_URL" # 디버깅용 출력
        
  run_daily_upload:
    runs-on: ubuntu-latest
    needs: deploy # deploy Job이 성공해야 이 Job이 실행됩니다.
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation을 위해 필요
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- ✨ 핵심 수정 3: Workload Identity Provider Audience 설정 (다시) ✨ ---
      # run_daily_upload Job에서도 인증이 필요하므로 동일하게 설정합니다.
      # audience를 실제 Cloud Run 서비스 URL로 설정합니다.
      - name: Authenticate to Google Cloud for Daily Upload
        id: 'auth_run'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
          audience: ${{ env.CLOUD_RUN_SERVICE_URL }} # 이전 단계에서 얻은 실제 URL 사용
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger Cloud Run service for Daily Upload
        run: |
          # Cloud Run 서비스 URL을 사용하여 POST 요청을 보냅니다.
          # 이 URL은 이전 'get_url' 단계에서 $GITHUB_ENV에 저장됩니다.
          if [ -z "${{ env.CLOUD_RUN_SERVICE_URL }}" ]; then
            echo "Error: CLOUD_RUN_SERVICE_URL is not set. Cannot trigger service."
            exit 1
          fi
          
          echo "Triggering Cloud Run service at ${{ env.CLOUD_RUN_SERVICE_URL }}"
          # Cloud Run 서비스에 인증된 요청을 보내기 위해 gcloud auth print-identity-token 사용
          TOKEN=$(gcloud auth print-identity-token --audiences=${{ env.CLOUD_RUN_SERVICE_URL }})
          
          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts", "metadata": {"news_topic": "AI 기술 뉴스"}}' \
            ${{ env.CLOUD_RUN_SERVICE_URL }}
        env:
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }} # GitHub Secrets에서 가져와야 함
