# .github/workflows/deploy-and-run.yml

name: Deploy and Run Cloud Function # 워크플로우 이름

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때 워크플로우 실행
  workflow_dispatch: # GitHub 웹 UI에서 수동으로 워크플로우를 실행할 수 있도록 함
  schedule:
    # 매일 5회 실행 (UTC 기준 시간, KST는 UTC+9)
    # UTC 03:00 (KST 12:00 정오)
    # UTC 07:00 (KST 16:00 오후 4시)
    # UTC 12:00 (KST 21:00 밤 9시)
    # UTC 18:00 (KST 익일 03:00 새벽 3시)
    # UTC 22:00 (KST 익일 07:00 아침 7시)
    - cron: '0 3,7,12,18,22 * * *'

env: # 환경 변수 설정
  GCP_PROJECT_ID: youtube-fully-automated # 당신의 GCP 프로젝트 ID
  GCP_BUCKET_NAME: youtube-fully-automated_cloudbuild # 당신의 GCS 버킷 이름 (혹은 당신의 실제 버킷 이름으로 변경)
  FUNCTION_NAME: youtube-shorts-automation # 배포될 Cloud Function의 이름
  REGION: us-central1 # Cloud Function이 배포될 GCP 리전

jobs:
  deploy: # 'deploy'라는 이름의 작업 정의
    runs-on: ubuntu-latest # 이 작업이 실행될 가상 머신 환경 (최신 Ubuntu)
    permissions:
      contents: read # 리포지토리 내용 읽기 권한
      id-token: write # GCP 인증을 위한 OIDC ID 토큰 생성 권한

    steps: # 작업의 단계들
      - name: ✅ Checkout Repository # 리포지토리 체크아웃 (코드를 가져옴)
        uses: actions/checkout@v4

      - name: 🐍 Set up Python # Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 사용할 Python 버전 지정

      - name: 📦 Install dependencies # Python 의존성 설치
        run: |
          if [ -f src/requirements.txt ]; then
            pip install -r src/requirements.txt
          else
            echo "❌ requirements.txt not found in src/"
            exit 1
          fi

      - name: 🔐 Authorize GCP Service Account # GCP 서비스 계정 인증
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"
          audience: 'https://token.actions.githubusercontent.com'

      - name: ☁️ Set up gcloud CLI # gcloud CLI(명령어 도구) 설정
        uses: google-github-actions/setup-gcloud@v2

      - name: 🚀 Deploy Cloud Function # Cloud Function 배포
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --runtime=python311 \
            --region=${{ env.REGION }} \
            --source=./src \
            --entry-point=trigger_youtube_upload \
            --trigger-http \
            --allow-unauthenticated \
            --memory=2048MB \
            --timeout=540s \
            --gen2 \
            --service-account=94662874801-compute@developer.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_BUCKET_NAME=youtube-fully-automated_cloudbuild" \
            --set-secrets="YOUTUBE_CLIENT_ID=projects/${{ env.GCP_PROJECT_ID }}/secrets/YOUTUBE_CLIENT_ID:latest,YOUTUBE_CLIENT_SECRET=projects/${{ env.GCP_PROJECT_ID }}/secrets/YOUTUBE_CLIENT_SECRET:latest,YOUTUBE_REFRESH_TOKEN=projects/${{ env.GCP_PROJECT_ID }}/secrets/YOUTUBE_REFRESH_TOKEN:latest,ELEVENLABS_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/ELEVENLABS_API_KEY:latest,OPENAI_API_KEYS=projects/${{ env.GCP_PROJECT_ID }}/secrets/OPENAI_API_KEYS:latest,GEMINI_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/GEMINI_API_KEY:latest,NEWSAPI_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/NEWSAPI_API_KEY:latest,PEXELS_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/PEXELS_API_KEY:latest,ELEVENLABS_VOICE_ID=projects/${{ env.GCP_PROJECT_ID }}/secrets/ELEVENLABS_VOICE_ID:latest"

      - name: 🌐 Invoke Cloud Function (Scheduled Run)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          FUNCTION_URL=$(gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(serviceConfig.uri)")
          echo "✅ Cloud Function URL: $FUNCTION_URL"

          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"daily_run": true}' \
              "${FUNCTION_URL}"

      - name: ⬆️ Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-output
          path: ./output
          retention-days: 7

      - name: List src directory contents
        run: ls -l src/
      - name: List src/bin directory contents
        run: ls -l src/bin/ || echo "src/bin directory not found or empty."
