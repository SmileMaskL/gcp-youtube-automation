# .github/workflows/deploy.yaml

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated # ✅ 실제 GCP 프로젝트 ID로 수정
  GCP_REGION: asia-northeast3 # ✅ 사용할 GCP 리전
  SERVICE_NAME: youtube-shorts-automation
  IMAGE_NAME: youtube-shorts-automation

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python (optional, Codespaces compatibility)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Generate Temporary Service Account Key
      run: |
        echo "${{ secrets.GCP_SA_KEY }}" > ./gcp-sa-key.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=./gcp-sa-key.json" >> "$GITHUB_ENV"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Confirm PROJECT_ID value
      run: echo "PROJECT_ID is ${{ env.PROJECT_ID }}"

    - name: Set GCP Project
      run: gcloud config set project ${{ env.PROJECT_ID }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Build Docker image
      run: docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest ./src

    - name: Push Docker image to GCR
      run: docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
          --region ${{ env.GCP_REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --timeout=300 \
          --project ${{ env.PROJECT_ID }}

    - name: Get Cloud Run Service URL
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format="value(status.url)" \
          --project ${{ env.PROJECT_ID }})
        echo "✅ 배포된 서비스 URL: $SERVICE_URL"

    - name: Cleanup Service Account Key
      if: always()
      run: rm -f ./gcp-sa-key.json
