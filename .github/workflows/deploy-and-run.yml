name: Deploy and Run YouTube Shorts Automation

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 실행을 위한 트리거

env:
  PROJECT_ID: youtube-fully-automated # 당신의 GCP 프로젝트 ID로 변경
  SERVICE_NAME: youtube-shorts-automation # Cloud Run 서비스 이름
  REGION: us-central1 # Cloud Run 서비스 배포 리전

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/94662874801/locations/global/workloadIdentityPools/github-pool/providers/github-provider' # 당신의 WIF 제공자 정보
        service_account: '94662874801-compute@developer.gserviceaccount.com' # 당신의 서비스 계정 이메일

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: 'Configure Docker for Google Container Registry'
      run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

    - name: 'Build and Push Docker Image to Artifact Registry'
      run: |
        docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE_NAME}-repo/${SERVICE_NAME}:${{ github.sha }} ./src
        docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE_NAME}-repo/${SERVICE_NAME}:${{ github.sha }}

    - name: 'Deploy to Cloud Run'
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE_NAME}-repo/${SERVICE_NAME}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --cpu 1 \
          --memory 2048Mi \
          --timeout 540 \
          --service-account 94662874801-compute@developer.gserviceaccount.com \
          --set-env-vars GCP_BUCKET_NAME=${{ env.PROJECT_ID }}_cloudbuild,GCP_PROJECT_ID=${{ env.PROJECT_ID }},LOG_EXECUTION_ID=true \
          --set-secrets \
            ELEVENLABS_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/ELEVENLABS_API_KEY:latest,\
            ELEVENLABS_VOICE_ID=projects/${{ env.PROJECT_ID }}/secrets/ELEVENLABS_VOICE_ID:latest,\
            GEMINI_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/GEMINI_API_KEY:latest,\
            NEWSAPI_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/NEWSAPI_API_KEY:latest,\
            OPENAI_API_KEYS=projects/${{ env.PROJECT_ID }}/secrets/OPENAI_API_KEYS:latest,\
            PEXELS_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/PEXELS_API_KEY:latest,\
            YOUTUBE_CLIENT_ID=projects/${{ env.PROJECT_ID }}/secrets/YOUTUBE_CLIENT_ID:latest,\
            YOUTUBE_CLIENT_SECRET=projects/${{ env.PROJECT_ID }}/secrets/YOUTUBE_CLIENT_SECRET:latest,\
            YOUTUBE_REFRESH_TOKEN=projects/${{ env.PROJECT_ID }}/secrets/YOUTUBE_REFRESH_TOKEN:latest
