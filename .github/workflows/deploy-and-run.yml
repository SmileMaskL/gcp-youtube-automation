# .github/workflows/deploy-and-run.yml

name: Deploy and Run Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행 허용
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC 실행

env:
  PROJECT_ID: youtube-fully-automated
  REGION: us-central1
  REPOSITORY: youtube-shorts-automation
  SERVICE_NAME: youtube-shorts-automation

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ✅ GCP 인증
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ env.PROJECT_ID }}

    # ✅ gcloud 설정
    - name: Set gcloud project
      run: gcloud config set project ${{ env.PROJECT_ID }}

    # ✅ Artifact Registry 인증
    - name: Configure docker to use gcloud as a credential helper
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    # ✅ Docker build
    - name: Build Docker image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest src

    # ✅ Docker push
    - name: Push Docker image
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

    # ✅ Cloud Run 배포
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
        region: ${{ env.REGION }}
        project_id: ${{ env.PROJECT_ID }}
        secrets: |
          YOUTUBE_CLIENT_ID=YOUTUBE_CLIENT_ID:latest
          YOUTUBE_CLIENT_SECRET=YOUTUBE_CLIENT_SECRET:latest
          YOUTUBE_REFRESH_TOKEN=YOUTUBE_REFRESH_TOKEN:latest

    # ✅ 배포된 Cloud Run 서비스 URL 출력
    - name: Get Cloud Run Service URL
      id: get_url
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --format="value(status.url)")
        echo "✅ 배포된 서비스 URL: $SERVICE_URL"
        echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

    # ✅ 배포된 서비스 호출 (예시)
    - name: Trigger Cloud Run Service
      run: |
        URL="${{ steps.get_url.outputs.service_url }}"
        if [ -z "$URL" ]; then
          echo "❌ Error: Cloud Run Service URL not found."
          exit 1
        fi
        echo "🔗 Triggering Cloud Run Service at: $URL"
        curl -X POST "$URL"
