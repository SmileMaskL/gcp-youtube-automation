name: Deploy and Run YouTube Shorts Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
  GCP_REGION: us-central1
  WIF_POOL_ID: github-actions-pool
  WIF_PROVIDER_ID: github-actions-provider-01
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_PROVIDER_ID }}"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        token_format: 'access_token'

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run
      run: |
        # 환경 변수 설정
        ENV_VARS="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},\
        GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }},\
        ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }},\
        ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }},\
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
        NEWS_API_KEY=${{ secrets.NEWS_API_KEY }},\
        OPENAI_API_KEYS=${{ secrets.OPENAI_API_KEYS }},\
        PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }},\
        YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }},\
        YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }},\
        YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}"

        gcloud run deploy youtube-shorts-automation \
          --source ./src \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --service-account ${{ env.SERVICE_ACCOUNT_EMAIL }} \
          --set-env-vars "$ENV_VARS" \
          --port=8080  # 명시적으로 포트 지정

        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
          --region ${{ env.GCP_REGION }} \
          --format="value(status.url)")
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
