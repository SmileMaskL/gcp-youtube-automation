name: Deploy to Cloud Run and Run Daily Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  PROJECT_NUM: 94662874801
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  PROVIDER_RESOURCE_NAME: projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ GCP 인증 (provider resource name을 audience로)
      - name: Authenticate to Google Cloud for gcloud commands
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          audience: "//iam.googleapis.com/${{ env.PROVIDER_RESOURCE_NAME }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./src \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}

      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
