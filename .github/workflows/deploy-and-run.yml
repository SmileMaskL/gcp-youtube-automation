# .github/workflows/deploy-and-run.yml
name: Deploy and Run YouTube Shorts Automation

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때마다 실행
  workflow_dispatch: # 수동 실행을 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
  GCP_REGION: asia-northeast3 # Cloud Run 서비스를 배포할 GCP 리전

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC 토큰 발급 필수 (Google Cloud 인증용)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 'Authenticate to Google Cloud'
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v2'
        service_account: 'github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com'

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Google Container Registry
      run: gcloud auth configure-docker

    - name: Build and Deploy Cloud Run Service
      id: deploy
      run: |
        # Cloud Run 서비스 배포. Dockerfile을 기반으로 이미지를 빌드하고 배포합니다.
        # 모든 필요한 Secret은 환경 변수로 Cloud Run 컨테이너에 전달됩니다.
        gcloud run deploy youtube-shorts-automation \
          --source ./src \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \ # 외부에서 호출할 경우 필요, 내부 호출 시에는 JWT 인증
          --service-account github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com \
          --set-env-vars \
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},\
            GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }},\
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }},\
            ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }},\
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
            NEWS_API_KEY=${{ secrets.NEWS_API_KEY }},\
            OPENAI_API_KEYS=${{ secrets.OPENAI_API_KEYS }},\
            PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }},\
            YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }},\
            YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }},\
            YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        
        # 배포된 서비스의 URL을 다음 스텝에서 사용하기 위해 출력
        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
                      --platform managed \
                      --region ${{ env.GCP_REGION }} \
                      --format="value(status.url)")
        
        echo "Cloud Run service deployed at: $SERVICE_URL"
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV # 환경 변수로 등록하여 다음 스텝에서 사용

    - name: Invoke Cloud Run Service for initial test (Optional)
      # 배포가 완료된 후, 간단한 테스트를 위해 Cloud Run 서비스를 호출합니다.
      # 실제 프로덕션에서는 daily_upload.yaml이 스케줄에 따라 호출하게 됩니다.
      run: |
        # Cloud Run 서비스는 인증된 호출만 허용할 수 있으므로, gcloud auth print-identity-token으로 토큰을 얻습니다.
        # --allow-unauthenticated를 사용하지 않았다면 이 토큰이 필수입니다.
        curl -X POST "${{ env.SERVICE_URL }}" \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
             -d '{"action": "test_run"}' # 테스트용 액션
      continue-on-error: true # 배포만 중요하고 이 호출은 테스트용이므로 오류 시 계속 진행
