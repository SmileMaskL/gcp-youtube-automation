# 수정된 파일: .github/workflows/deploy-and-run.yml

name: Deploy and Run YouTube Shorts Automation

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  PROJECT_ID: 'youtube-fully-automated' # GCP 프로젝트 ID (이 값이 정확해야 합니다!)
  GCP_REGION: 'us-central1' # Cloud Run 서비스 배포 리전
  CLOUD_RUN_SERVICE_NAME: 'youtube-shorts-automation'
  GCP_BUCKET_NAME: 'youtube-fully-automated_youtube_shorts_temp_files' # Cloud Storage 버킷 이름 (고유해야 함)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # This is required for Workload Identity Federation

    steps:
      - name: '코드 체크아웃'
        uses: 'actions/checkout@v4'

      # --- ⭐️⭐️⭐️ 중요: GCP Audience URL 및 SUB 클레임 값 확인 스텝 (가장 안전한 버전) ⭐️⭐️⭐️ ---
      # 이 스텝은 정확한 정보를 얻기 위한 디버그용입니다.
      # 이 스텝의 출력을 확인하고 GCP 설정을 마친 후에는 이 스텝을 제거할 수 있습니다.
      - name: 'GCP Workload Identity Provider Audience URL 및 GitHub OIDC SUB 클레임 값 출력'
        id: 'debug-output'
        uses: actions/github-script@v7
        with:
          # 스크립트가 단일 라인으로 작성되어 YAML 파싱 오류를 최소화합니다.
          # 모든 공백은 중요하므로 절대 변경하지 마세요.
          script: |
            try { const githubOidcToken = await core.getIDToken('https://token.actions.githubusercontent.com'); const tokenPayload = JSON.parse(Buffer.from(githubOidcToken.split('.')[1], 'base64').toString('utf-8')); const subClaim = tokenPayload.sub; core.info(`\n⭐️⭐️⭐️ 중요 정보 확인 ⭐️⭐️⭐️\n--------------------------------------------------------------------------------------------------\n1. GitHub Actions에서 생성된 OIDC 토큰의 'sub' 클레임 값:\n${subClaim}\n(이 값을 GCP Workload Identity Provider의 '액세스 권한 부여' > '속성 값' 필드에 입력하세요. 따옴표 없이.)\n\n2. GCP Workload Identity Provider '속성 조건(Attribute Condition)'에 설정할 CEL 조건문:\nattribute.sub == "${subClaim}"\n(이 줄 전체를 GCP Workload Identity Provider '제공업체 수정' > '속성 조건' 필드에 복사/붙여넣기 하세요. 따옴표 포함.)\n\n3. GCP Workload Identity Provider '대상 (Audience)' URL:\n(이 URL은 GCP 콘솔에서 직접 복사하여 아래 'audience' 파라미터에 붙여넣어야 합니다.)\n예시: https://iam.googleapis.com/projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1\n--------------------------------------------------------------------------------------------------\n`); core.setOutput('sub_claim_value', subClaim); } catch (error) { core.setFailed(`GitHub OIDC 토큰 추출 또는 출력 중 오류 발생: ${error.message}`); console.error(error); }
      # --- ⭐️⭐️⭐️ 여기까지입니다! ⭐️⭐️⭐️ ---

      - name: 'Google Cloud 인증'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1'
          service_account: '94662874801-compute@developer.gserviceaccount.com'
          # ⭐️⭐️⭐️ 중요: GCP 콘솔에서 복사한 정확한 Audience URL을 여기에 붙여넣으세요! ⭐️⭐️⭐️
          audience: 'https://iam.googleapis.com/projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1' # ⭐️⭐️⭐️ 이 부분을 다시 한번 확인하고 수정! ⭐️⭐️⭐️
          create_credentials_file: true
          export_environment_variables: true
          universe: googleapis.com
          cleanup_credentials: true
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          id_token_include_email: false


      - name: 'Terraform 설치 및 설정'
        uses: 'hashicorp/setup-terraform@v3'
        with:
          terraform_version: '1.7.5'

      - name: 'Terraform 초기화'
        run: |
          terraform -chdir=./terraform init

      - name: 'Terraform 적용'
        run: |
          terraform -chdir=./terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="gcp_region=${{ env.GCP_REGION }}" \
            -var="cloud_run_service_name=${{ env.CLOUD_RUN_SERVICE_NAME }}" \
            -var="gcp_bucket_name=${{ env.GCP_BUCKET_NAME }}"
        env:
          TF_VAR_cloud_run_service_account_email: ${{ env.PROJECT_ID }}-compute@developer.gserviceaccount.com

      - name: 'Cloud Build를 사용하여 Cloud Run 서비스 빌드 및 배포'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          source: ./src # Dockerfile과 Python 코드가 있는 디렉토리
          env_vars: |
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }}
            YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
            YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
            YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
            ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}
            OPENAI_API_KEYS=${{ secrets.OPENAI_API_KEYS }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            NEWSAPI_API_KEY=${{ secrets.NEWSAPI_API_KEY }}
            PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
