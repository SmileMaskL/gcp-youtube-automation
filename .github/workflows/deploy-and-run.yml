name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4

    # GCP 인증
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        PROJECT_ID: ${{ env.PROJECT_ID }}

    # ✅ gcloud project 설정
    - name: Set gcloud project
      run: gcloud config set project ${{ env.PROJECT_ID }}

    # Artifact Registry 인증
    - name: Configure docker to use gcloud as a credential helper
      run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev

    # Docker 빌드
    - name: Build Docker image
      run: |
        cd src
        docker build -t asia-northeast3-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:latest .

    # Push to Artifact Registry
    - name: Push Docker image
      run: |
        docker push asia-northeast3-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:latest

    # GCR 푸시
    - name: Push to GCR
      run: |
        docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}

    # Cloud Run 배포
    - uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        credentials: ${{ secrets.GCP_CREDENTIALS }}
        env_vars: |
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS=/app/youtube-fully-automated.json
