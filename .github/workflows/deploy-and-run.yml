name: Deploy to Cloud Run via Workload Identity

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때 워크플로우 실행

env:
  PROJECT_ID: developer # <-- 고객님의 서비스 계정이 속한 프로젝트 ID로 변경
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE_NAME: youtube-shorts-automation
  GCP_BUCKET_NAME: youtube-fully-automated_youtube_shorts_temp_files # 이 버킷은 어떤 프로젝트에 있는지 확인 필요, 필요시 조정

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC 토큰 생성을 위해 필요

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get OIDC Token and Extract Sub Claim
        id: get_oidc_sub
        uses: actions/github-script@v7
        with:
          script: |
            const githubOidcToken = await core.getIDToken('https://token.actions.githubusercontent.com');
            const tokenPayload = JSON.parse(Buffer.from(githubOidcToken.split('.')[1], 'base64').toString('utf-8'));
            const subClaim = tokenPayload.sub;
            
            core.info(`
            ⭐️⭐️⭐️ 중요 정보 확인 ⭐️⭐️⭐️
            --------------------------------------------------------------------------------------------------
            1. GitHub Actions에서 생성된 OIDC 토큰의 'sub' 클레임 값:
            ${subClaim}
            (이 값을 GCP Workload Identity Provider의 '액세스 권한 부여' > '속성 값' 필드에 입력하세요. 따옴표 없이.)
            
            2. GCP Workload Identity Provider '속성 조건(Attribute Condition)'에 설정할 CEL 조건문:
            attribute.sub == "${subClaim}"
            (이 줄 전체를 GCP Workload Identity Provider '제공업체 수정' > '속성 조건' 필드에 복사/붙여넣기 하세요. **반드시 큰따옴표 포함**.)
            
            3. GCP Workload Identity Provider '대상 (Audience)' URL:
            (이 URL은 GCP 콘솔에서 직접 복사하여 아래 'audience' 파라미터에 붙여넣어야 합니다.)
            예시: https://iam.googleapis.com/projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1
            --------------------------------------------------------------------------------------------------
            `);
            core.setOutput('sub_claim_value', subClaim);
          debug: false
          github-token: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN은 자동으로 제공됨

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # 워크로드 아이덴티티 제공업체 경로는 일반적으로 프로젝트 번호를 포함합니다.
          # 94662874801은 고객님의 프로젝트 번호입니다.
          workload_identity_provider: 'projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1'
          
          # 고객님께서 실제로 사용하려는 서비스 계정 이메일로 변경했습니다.
          service_account: '94662874801-compute@developer.gserviceaccount.com' 

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }} # 이제 'developer' 프로젝트 ID로 설정됩니다.

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image to Artifact Registry
        run: |
          # Artifact Registry는 'developer' 프로젝트 내에 생성됩니다.
          gcloud builds submit --tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE_NAME }}/youtube-shorts-automation:latest .

      - name: Deploy to Cloud Run
        run: |
          # Cloud Run 서비스는 'developer' 프로젝트 내에 배포됩니다.
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE_NAME }}/youtube-shorts-automation:latest \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated # 필요에 따라 제거하거나 다른 인증 방식으로 변경
            # 추가적으로 필요한 Cloud Run 설정 (예: --platform managed, --cpu, --memory 등)

      - name: Deploy Google Cloud Function (Example: Not directly provided in original context, but common for serverless)
        # 이 스텝은 예시이며, 실제 함수 코드가 필요합니다.
        # 예: functions/main.py 또는 functions/index.js
        # gcloud functions deploy your-function-name \
        #   --region ${{ env.GCP_REGION }} \
        #   --entry-point your_entry_point \
        #   --runtime python39 \ # 또는 nodejs16 등
        #   --trigger-http \ # 또는 --trigger-event, --trigger-resource 등
        #   --source ./functions/your-function-source-dir \
        #   --project ${{ env.PROJECT_ID }} \
        #   --service-account 94662874801-compute@developer.gserviceaccount.com # <-- 이 서비스 계정으로 변경

      - name: Clean up temporary files in GCS (Optional, for managing storage costs)
        run: |
          # 이 GCS 버킷이 'developer' 프로젝트에 속해있는지 확인하거나, 정확한 프로젝트 ID가 필요한 경우 수정해야 합니다.
          gsutil -m rm -r gs://${{ env.GCP_BUCKET_NAME }}/* # 주의: 프로덕션 환경에서는 더 정교한 관리 필요
