# .github/workflows/deploy-and-run.yml
name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  REGION: us-central1 # ✅ REGION을 us-central1로 명확히 설정
  SERVICE_NAME: youtube-shorts-automation

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4

    # GCP 인증
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ env.PROJECT_ID }}

    # gcloud project 설정
    - name: Set gcloud project
      run: gcloud config set project ${{ env.PROJECT_ID }}

    # Cloud Build API 활성화 (주석 처리 유지 - 관리자가 수동 활성화 권장)
    # - name: Enable Cloud Build API
    #   run: gcloud services enable cloudbuild.googleapis.com

    # Artifact Registry 인증 (us-central1-docker.pkg.dev로 변경)
    - name: Configure docker to use gcloud as a credential helper
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev # ✅ REGION 변수 사용

    # Docker build (Artifact Registry - us-central1)
    - name: Build Docker image
      run: |
        cd src
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:latest . # ✅ REGION 변수 사용

    # Push to Artifact Registry (us-central1)
    - name: Push Docker image
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:latest # ✅ REGION 변수 사용

    # Cloud Run 배포 (Artifact Registry 이미지 사용, us-central1)
    - uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:latest # ✅ REGION 변수 사용
        region: ${{ env.REGION }} # ✅ REGION 변수 사용
        credentials: ${{ secrets.GCP_CREDENTIALS }}
        env_vars: |
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }} # ✅ app.py 수정에 따라 추가
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # GOOGLE_APPLICATION_CREDENTIALS=/app/youtube-fully-automated.json # ⚠️ 보안상 비권장, 제거 고려
