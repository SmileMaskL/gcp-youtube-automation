name: Deploy and Run YouTube Shorts Automation

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  PROJECT_ID: 'youtube-fully-automated' # GCP 프로젝트 ID
  GCP_REGION: 'us-central1' # Cloud Run 서비스 배포 리전
  CLOUD_RUN_SERVICE_NAME: 'youtube-shorts-automation'
  GCP_BUCKET_NAME: 'youtube-fully-automated_youtube_shorts_temp_files' # Cloud Storage 버킷 이름 (고유해야 함)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # This is required for Workload Identity Federation

    steps:
      - name: '코드 체크아웃'
        uses: 'actions/checkout@v4'

      - name: 'Google Cloud 인증'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          # Workload Identity Provider의 전체 리소스 경로
          workload_identity_provider: 'projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1'
          # Terraform과 Cloud Run 배포에 사용될 서비스 계정
          service_account: '94662874801-compute@developer.gserviceaccount.com'
          # !!! GCP Workload Identity Provider의 '대상 (Audience)' 필드와 정확히 일치해야 합니다 !!!
          audience: 'https://iam.googleapis.com/projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v1'

      - name: 'OIDC 토큰 클레임 출력 (디버그용)'
        run: |
          ID_TOKEN=$(step_output=$(jq -r '.id_token' ${{ steps.auth.outputs.credentials_file_path }}); echo $ID_TOKEN)
          echo "Full ID Token:"
          echo $ID_TOKEN
          echo "Decoded ID Token (Claims):"
          echo $ID_TOKEN | awk -F'.' '{print $2}' | base64 -d 2>/dev/null | jq .
        shell: bash

      - name: 'Terraform 설치 및 설정'
        uses: 'hashicorp/setup-terraform@v3'
        with:
          terraform_version: '1.7.5'

      - name: 'Terraform 초기화'
        run: |
          terraform -chdir=./terraform init

      - name: 'Terraform 적용'
        run: |
          terraform -chdir=./terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="gcp_region=${{ env.GCP_REGION }}" \
            -var="cloud_run_service_name=${{ env.CLOUD_RUN_SERVICE_NAME }}" \
            -var="gcp_bucket_name=${{ env.GCP_BUCKET_NAME }}"
        env:
          # Terraform이 Cloud Run 서비스 계정의 이메일을 환경 변수로 사용하도록 설정
          TF_VAR_cloud_run_service_account_email: ${{ env.PROJECT_ID }}-compute@developer.gserviceaccount.com # Cloud Run 서비스 계정 (default compute SA)

      - name: 'Cloud Build를 사용하여 Cloud Run 서비스 빌드 및 배포'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          source: ./src # Dockerfile과 Python 코드가 있는 디렉토리
          env_vars: | # Cloud Run 서비스에 환경 변수로 주입 (보안 유의)
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }}
            # 아래 환경 변수들은 실제 값으로 채워져야 합니다.
            # GitHub Secrets에 저장하여 사용하는 것이 가장 안전합니다.
            YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
            YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
            YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
            ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}
            OPENAI_API_KEYS=${{ secrets.OPENAI_API_KEYS }} # 쉼표로 구분된 여러 키
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            NEWSAPI_API_KEY=${{ secrets.NEWSAPI_API_KEY }}
            PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
