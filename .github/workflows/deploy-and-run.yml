# .github/workflows/deploy-and-run.yml

name: Deploy and Run Cloud Function

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3,7,12,18,22 * * *' # 매일 5회 실행 (KST 기준 12시, 16시, 21시, 익일 03시, 07시)

env:
  GCP_PROJECT_ID: youtube-fully-automated
  GCP_BUCKET_NAME: youtube-fully-automated_cloudbuild
  FUNCTION_NAME: youtube-shorts-automation
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps: # <-- 'steps:' 아래에 모든 스텝들이 옵니다.
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          if [ -f src/requirements.txt ]; then
            pip install -r src/requirements.txt
          else
            echo "❌ requirements.txt not found in src/"
            exit 1
          fi

      - name: 🔐 Authorize GCP Service Account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: ☁️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 🚀 Deploy Cloud Function
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --runtime=python311 \
            --region=${{ env.REGION }} \
            --source=./src \
            --entry-point=trigger_youtube_upload \ # 이전 답변에서 수정 제안했던 부분
            --trigger-http \
            --allow-unauthenticated \
            --memory=2048MB \
            --timeout=540s \
            --gen2 \
            --service-account=${{ secrets.WIF_SERVICE_ACCOUNT }} \
            --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }},GCS_VIDEO_PATH=videos/generated_video.mp4" \ # GCS_VIDEO_PATH 추가 예시
            --set-secrets="YOUTUBE_CLIENT_ID=projects/${{ env.GCP_PROJECT_ID }}/secrets/YOUTUBE_CLIENT_ID:latest,YOUTUBE_CLIENT_SECRET=projects/${{ env.GCP_PROJECT_ID }}/secrets/YOUTUBE_CLIENT_SECRET:latest,YOUTUBE_REFRESH_TOKEN=projects/${{ env.GCP_PROJECT_ID }}/secrets/YOUTUBE_REFRESH_TOKEN:latest,ELEVENLABS_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/ELEVENLABS_API_KEY:latest,OPENAI_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/OPENAI_API_KEY:latest,GEMINI_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/GEMINI_API_KEY:latest,NEWSAPI_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/NEWSAPI_API_KEY:latest,PEXELS_API_KEY=projects/${{ env.GCP_PROJECT_ID }}/secrets/PEXELS_API_KEY:latest"

      - name: 🌐 Invoke Cloud Function (Scheduled Run)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          FUNCTION_URL=$(gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(serviceConfig.uri)")
          echo "✅ Cloud Function URL: $FUNCTION_URL"
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"daily_run": true}' \
              "${FUNCTION_URL}"

      - name: List src directory contents
        run: ls -l src/

      - name: Upload artifacts # <-- 이 부분이 'steps:' 바로 아래, 즉 위 스텝들과 동일한 들여쓰기로 위치해야 합니다.
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: ./output
