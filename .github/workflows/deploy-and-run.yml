# .github/workflows/deploy-and-run.yml
name: Deploy and Run YouTube Shorts Automation

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때마다 실행
  workflow_dispatch: # 수동 실행을 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }} # GitHub Secrets에 정확한 프로젝트 번호(숫자)가 있어야 합니다.
  GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
  GCP_REGION: asia-northeast3 # Cloud Run 서비스를 배포할 GCP 리전

  WIF_POOL_ID: github-actions-pool
  WIF_PROVIDER_ID: github-actions-provider-01
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC 토큰 발급 필수 (Google Cloud 인증용)

    steps:
    - name: Checkout code
      uses: 'actions/checkout@v4'

    - name: 'Authenticate to Google Cloud'
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        # 워크로드 아이덴티티 풀과 프로바이더 경로를 env.GCP_PROJECT_NUMBER로 통일
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_PROVIDER_ID }}"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        # audience URL도 env.GCP_PROJECT_NUMBER로 통일
        audience: "https://iam.googleapis.com/projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_PROVIDER_ID }}"

    - name: Set up Google Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for Google Container Registry
      run: gcloud auth configure-docker

    - name: Build and Deploy Cloud Run Service
      id: deploy
      run: |
        # 환경 변수 문자열을 미리 구성합니다.
        # 이렇게 하면 YAML 파싱이나 쉘 줄바꿈 문제 없이 정확하게 전달됩니다.
        ENV_VARS="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
        ENV_VARS="${ENV_VARS},GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }}"
        ENV_VARS="${ENV_VARS},ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}"
        ENV_VARS="${ENV_VARS},ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}"
        ENV_VARS="${ENV_VARS},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
        ENV_VARS="${ENV_VARS},NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}"
        ENV_VARS="${ENV_VARS},OPENAI_API_KEYS=\"${{ secrets.OPENAI_API_KEYS }}\"" # Secret 값은 이중 따옴표로 감쌈
        ENV_VARS="${ENV_VARS},PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}"
        ENV_VARS="${ENV_VARS},YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}"
        ENV_VARS="${ENV_VARS},YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}"
        ENV_VARS="${ENV_VARS},YOUTUBE_REFRESH_TOKEN=\"${{ secrets.YOUTUBE_REFRESH_TOKEN }}\"" # Secret 값은 이중 따옴표로 감쌈
        
        gcloud run deploy youtube-shorts-automation \
          --source ./src \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --service-account ${{ env.SERVICE_ACCOUNT_EMAIL }} \
          --set-env-vars "$ENV_VARS" # 구성된 변수 전달 (이중 따옴표 필수)

        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
                      --platform managed \
                      --region ${{ env.GCP_REGION }} \
                      --format="value(status.url)")

        echo "Cloud Run service deployed at: $SERVICE_URL"
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

    - name: Invoke Cloud Run Service for initial test (Optional)
      # 실제 호출 시에는 인증 토큰이 필요할 수 있으므로, 초기 배포 확인용으로만 사용합니다.
      # 이 단계가 실패하더라도 다음 단계에 영향 주지 않도록 continue-on-error를 true로 설정합니다.
      run: |
        curl -X POST "${{ env.SERVICE_URL }}" \
             -H "Content-Type: application/json" \
             -d '{"action": "test_run"}'
      continue-on-error: true
