# .github/workflows/daily_upload.yaml

name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 기준 매일 자정 (KST 오전 9시)
  workflow_dispatch: # 수동 실행을 위한 트리거

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  PROVIDER_RESOURCE_NAME: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

jobs:
  trigger_upload_process:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation (OIDC) 토큰 생성을 위해 필요

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 🔑 GCP 인증 ---
      # ID 토큰을 직접 요청하도록 token_format을 'id_token'으로 변경하고,
      # audience를 Cloud Run 서비스 URL로 명시적으로 지정합니다.
      - name: Authenticate to Google Cloud and get ID Token for Cloud Run
        id: auth_id_token # ID를 변경하여 명확히 합니다.
        uses: google-github-actions/auth@v2
        with:
          # Cloud Run 호출에 필요한 ID 토큰을 직접 요청합니다.
          token_format: 'id_token' # <--- 이 라인이 변경되었습니다!
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          # Cloud Run 호출을 위한 ID 토큰이므로, audience를 Cloud Run 서비스 URL로 지정합니다.
          audience: ${{ env.CLOUD_RUN_SERVICE_URL }} # <--- 이 라인이 추가되었습니다!

      - name: Set up Cloud SDK # gcloud 명령을 사용하지 않지만, 환경 설정 관례상 유지합니다.
        uses: google-github-actions/setup-gcloud@v2

      # --- ☁️ Cloud Run 서비스 URL 가져오기 ---
      # 이 스텝은 이전과 동일하게 유지됩니다.
      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "✅ Cloud Run Service URL: $SERVICE_URL"

          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Error: Cloud Run service URL could not be retrieved."
            exit 1
          fi

      # --- 🚀 Cloud Run 서비스 트리거 ---
      # google-github-actions/auth 액션에서 직접 얻은 ID 토큰을 사용합니다.
      - name: Trigger Cloud Run service with ID Token
        run: |
          if [ -z "${{ env.CLOUD_RUN_SERVICE_URL }}" ]; then
            echo "❌ Error: CLOUD_RUN_SERVICE_URL is not set. Cannot trigger service."
            exit 1
          fi

          echo "🚀 Triggering Cloud Run service at ${{ env.CLOUD_RUN_SERVICE_URL }}"

          # Authenticate to Google Cloud and get ID Token for Cloud Run 스텝에서 얻은 ID 토큰 사용
          # 이전 단계의 ID가 auth_id_token이므로, steps.auth_id_token.outputs.id_token 사용
          TOKEN="${{ steps.auth_id_token.outputs.id_token }}" # <--- 이 라인이 변경되었습니다!

          if [ -z "$TOKEN" ]; then
            echo "❌ Error: ID Token for Cloud Run service could not be retrieved."
            exit 1
          fi

          echo "✅ Using ID Token to call Cloud Run service."

          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts"}' \
            "${{ env.CLOUD_RUN_SERVICE_URL }}"
