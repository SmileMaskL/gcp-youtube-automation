name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 3,7,12,18,22 * * *'  # UTC 기준 매일 5회 실행
  workflow_dispatch:  # 수동 실행 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_REGION: asia-northeast3
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'  # OIDC 토큰 사용 허용

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Cloud 인증 (Workload Identity Federation)
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        token_format: 'access_token'  # ✅ 핵심 변경점: 자동 생성된 액세스 토큰 사용

    - name: Google Cloud SDK 설치
      uses: google-github-actions/setup-gcloud@v2

    - name: Cloud Run 서비스 호출
      run: |
        # Cloud Run 서비스 URL 가져오기
        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
          --region=${{ env.GCP_REGION }} \
          --format="value(status.url)")

        # ✅ 자동 생성된 액세스 토큰으로 Cloud Run 호출
        curl -X POST "$SERVICE_URL" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -d '{"action": "create_and_upload_shorts"}'
