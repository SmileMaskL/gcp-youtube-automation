name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 3,7,12,18,22 * * *'  # UTC 기준 3,7,12,18,22시 (하루 5회)
  workflow_dispatch:  # 수동 실행 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_REGION: asia-northeast3
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'  # 🔑 핵심! OIDC 토큰 사용 허용

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ✅ 인증 단계 (새로운 표준 방식)
    - name: 'Google Cloud 인증'
      id: auth  # 이 ID로 토큰 사용!
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        token_format: 'access_token'  # 액세스 토큰 자동 생성

    - name: 'Google Cloud SDK 설정'
      uses: google-github-actions/setup-gcloud@v2

    # ✅ 서비스 호출 (토큰 직접 사용)
    - name: 'Cloud Run 서비스 실행'
      run: |
        # 서비스 URL 자동 조회
        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
          --region=${{ env.GCP_REGION }} \
          --format="value(status.url)")

        # 🔥 핵심 변경점: 자동 생성 토큰 사용
        curl -X POST "$SERVICE_URL" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -d '{"action": "create_and_upload_shorts"}'
