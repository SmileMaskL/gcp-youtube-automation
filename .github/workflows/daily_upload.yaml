# .github/workflows/deploy-and-run.yml
name: Deploy and Run Automation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 12 * * *'  # 매일 12PM UTC 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Deploy to Cloud Run
      run: |-
        gcloud run deploy youtube-shorts-automation \
          --project=${{ secrets.GCP_PROJECT }} \
          --region=us-central1 \
          --source=. \
          --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest" \
          --set-secrets="OPENAI_API_KEYS=OPENAI_API_KEYS:latest" \
          --set-secrets="YOUTUBE_CREDENTIALS_JSON=YOUTUBE_CREDENTIALS_JSON:latest" \
          --memory=4Gi \
          --cpu=2 \
          --timeout=600s \
          --service-account=automation-sa@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com
