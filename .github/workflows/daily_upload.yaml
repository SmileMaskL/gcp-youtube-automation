# .github/workflows/daily_upload.yaml

name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 KST 오전 9시 실행 (UTC 00:00은 KST 09:00입니다)
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  IMAGE_NAME: youtube-shorts-automation
  # PROVIDER_RESOURCE_NAME: secrets.GCP_PROJECT_NUMBER가 아닌 실제 PROJECT_NUM 사용
  PROVIDER_RESOURCE_NAME: projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

jobs:
  deploy_and_trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'  # OIDC 토큰 발급을 위해 필요

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🔑 GCP 인증
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}

      # ☁️ gcloud CLI 설치
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ✅ 인증 확인
      - name: Verify GCP authentication
        run: gcloud auth list

      # 🛠️ Docker build & push (Cloud Build를 사용하여 이미지 빌드 및 GCR 푸시)
      # gcloud builds submit 명령어가 올바른 인자를 사용하도록 수정
      - name: Build and Push Docker image to GCR via Cloud Build
        run: |
          gcloud builds submit ./src \
            --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            --project ${{ env.PROJECT_ID }}

      # 🚀 Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}

      # ☁️ Get Cloud Run Service URL
      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Error: Cloud Run service URL could not be retrieved."
            exit 1
          fi

      # 🔑 ID 토큰 발급
      - name: Get ID Token for Cloud Run
        id: auth_id_token
        uses: google-github-actions/auth@v2
        with:
          token_format: 'id_token'
          id_token_audience: ${{ steps.get_url.outputs.url }}
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}

      # 🚀 Trigger Cloud Run service
      - name: Trigger Cloud Run service
        run: |
          echo "🚀 Triggering Cloud Run service at ${{ env.CLOUD_RUN_SERVICE_URL }}"
          TOKEN="${{ steps.auth_id_token.outputs.id_token }}"

          if [ -z "$TOKEN" ]; then
            echo "❌ Error: ID Token could not be retrieved."
            exit 1
          fi

          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts"}' \
            "${{ env.CLOUD_RUN_SERVICE_URL }}"
