name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 자정 실행
  workflow_dispatch:     # 수동 실행 허용

jobs:
  upload_shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 1: Cloud Run URL 가져오기
      - name: Get Cloud Run service URL
        id: get_service_url
        run: |
          SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
            --platform managed \
            --region us-central1 \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      # STEP 2: GCP 인증 설정 (핵심 수정 부분!)
      - name: Configure GCP credentials
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          id_token: https://youtube-shorts-automation  # 고정된 audience 값
          create_credentials_file: true

      # STEP 3: Cloud SDK 설정
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # STEP 4: Cloud Run 호출
      - name: Call Cloud Run service
        run: |
          REQUEST_BODY='{"action": "create_and_upload_shorts"}'
          ID_TOKEN="${{ steps.auth.outputs.id_token }}"
          SERVICE_URL="${{ steps.get_service_url.outputs.SERVICE_URL }}"

          curl -X POST "$SERVICE_URL" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY"
