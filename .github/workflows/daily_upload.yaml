# .github/workflows/daily_upload.yaml

name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 자정 실행
  workflow_dispatch: # 수동 실행을 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }} # Workload Identity Pool 풀 번호
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE_NAME: youtube-shorts-automation
  GCP_SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com 

jobs:
  upload_shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC를 통한 인증을 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 0: gcloud CLI 설치 및 구성 (프로젝트 ID 설정 포함)
      - name: Set up Cloud SDK and Configure Project
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          # 이 액션이 실행 컨텍스트에 project_id를 설정합니다.

      # STEP 0.5: Google Cloud 인증 (Cloud Run 서비스 호출을 위한 ID 토큰 발급)
      # Cloud Run URL을 가져오기 전에 먼저 인증합니다.
      - name: Authenticate to GCP for Cloud Run call
        id: auth # 이 id를 사용하여 나중에 id_token을 가져옵니다.
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Provider의 전체 리소스 이름
          # secrets.GCP_PROJECT_NUMBER는 워크로드 아이덴티티 풀의 풀 번호입니다.
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          # id_token_audience는 나중에 Cloud Run URL을 가져와서 설정합니다.
          # create_credentials_file: true # 불필요, 삭제
          # export_environment_variables: true # 불필요, 삭제

      # STEP 1: Cloud Run 서비스 URL 가져오기
      - name: Get Cloud Run service URL
        id: get_service_url
        run: |
          # 💡 인증이 제대로 되었는지 확인하는 디버그 라인
          gcloud auth list --filter=ACTIVE

          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')

          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Cloud Run 서비스 URL을 찾을 수 없습니다."
            exit 1
          fi

          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Cloud Run 서비스 URL: $SERVICE_URL" # 디버그 출력

      # STEP 2: ID Token Audience 동적으로 설정 및 토큰 재발급 (⭐추가⭐)
      # Cloud Run URL을 가져온 후, 그 URL을 audience로 사용하여 ID 토큰을 다시 생성합니다.
      # 이렇게 해야 Cloud Run이 이 토큰을 신뢰합니다.
      - name: Re-authenticate with Cloud Run Service URL as Audience
        id: auth_with_audience
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          # 💡 이제 서비스 URL을 audience로 정확히 지정합니다.
          id_token_audience: ${{ steps.get_service_url.outputs.SERVICE_URL }}
          # create_credentials_file: true # 불필요, 삭제
          # export_environment_variables: true # 불필요, 삭제

      # STEP 3: Cloud Run 서비스 호출
      - name: Call Cloud Run service
        run: |
          REQUEST_BODY=$(cat <<EOF
          {
            "action": "create_and_upload_shorts",
            "metadata": {
              "workflow_run_id": "${{ github.run_id }}",
              "trigger_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
              "news_topic": "최신 과학 기술" # 매일 다른 주제를 원한다면 이 부분을 변경하거나 동적으로 생성 가능
            }
          }
          EOF
          )

          # ⚠️ 이제 ID_TOKEN은 새로 재발급받은 'auth_with_audience' 스텝의 output으로 가져옵니다.
          ID_TOKEN=${{ steps.auth_with_audience.outputs.id_token }}

          if [ -z "$ID_TOKEN" ]; then
            echo "::error::ID_TOKEN을 가져오지 못했습니다. 인증 실패!"
            exit 1
          fi

          echo "✅ Cloud Run 서비스 호출 시작..."
          RESPONSE=$(curl --fail-with-body -sS -m 600 -X POST "${{ steps.get_service_url.outputs.SERVICE_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -d "$REQUEST_BODY")

          echo "Cloud Run 응답: $RESPONSE"
          echo "✅ Cloud Run 서비스 호출 완료."
