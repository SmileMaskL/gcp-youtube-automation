name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정 (KST 오전 9시)
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  PROJECT_NUM: 94662874801
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  PROVIDER_RESOURCE_NAME: projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider

jobs:
  trigger_upload_process:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'  # OIDC 토큰 발급을 위해 필수

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1단계: GCP 인증 (Workload Identity Federation 사용)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com'
          # audience 파라미터 제거 (기본값 사용)

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2단계: Cloud Run URL 획득
      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")

          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "✅ Cloud Run Service URL: $SERVICE_URL"

          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Error: Cloud Run service URL could not be retrieved."
            exit 1
          fi

      # 3단계: Cloud Run 서비스 호출 (개선된 버전)
      - name: Trigger Cloud Run service
        run: |
          # GitHub OIDC 토큰 직접 획득 (Cloud Run URL을 audience로)
          echo "ℹ️ Getting ID token for Cloud Run service..."
          ID_TOKEN=$(curl -sSfL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CLOUD_RUN_SERVICE_URL" | jq -r '.value')
          
          # 토큰 유효성 검사
          if [ -z "$ID_TOKEN" ]; then
            echo "❌ Failed to get ID token"
            exit 1
          fi

          echo "ℹ️ Cloud Run Service URL: $CLOUD_RUN_SERVICE_URL"
          echo "ℹ️ Token 길이: ${#ID_TOKEN}"

          # Cloud Run 호출 (상세 로깅 포함)
          echo "🚀 Calling Cloud Run service..."
          curl -v -X POST \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "create_and_upload_shorts",
              "metadata": {
                "source": "github-actions",
                "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              }
            }' \
            "$CLOUD_RUN_SERVICE_URL"

          # 호출 결과 확인
          if [ $? -ne 0 ]; then
            echo "❌ Cloud Run service call failed"
            exit 1
          else
            echo "✅ Cloud Run service triggered successfully"
          fi
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ vars.ACTIONS_ID_TOKEN_REQUEST_URL }}
