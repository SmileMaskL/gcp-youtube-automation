name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 자정 실행
  workflow_dispatch:

jobs:
  upload_shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # STEP 1: Cloud Run 서비스 URL 먼저 가져오기
      - name: Get Cloud Run service URL
        id: get_service_url
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

          SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
            --platform managed \
            --region us-central1 \
            --format 'value(status.url)')

          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Cloud Run 서비스 URL을 찾을 수 없습니다."
            exit 1
          fi

          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      # STEP 2: GCP 자격 증명 설정 및 ID Token 발급
      - name: Configure GCP credentials and get ID Token for Cloud Run
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          id_token_audience: ${{ steps.get_service_url.outputs.SERVICE_URL }}
          create_credentials_file: true
          export_environment_variables: true

      # STEP 3: Cloud Run 서비스 호출
      - name: Call Cloud Run service
        run: |
          REQUEST_BODY=$(cat <<EOF
          {
            "action": "create_and_upload_shorts",
            "metadata": {
              "workflow_run_id": "${{ github.run_id }}",
              "trigger_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            }
          }
          EOF
          )

          ID_TOKEN=${{ steps.auth.outputs.id_token }}

          if [ -z "$ID_TOKEN" ]; then
            echo "::error::ID_TOKEN을 가져오지 못했습니다."
            exit 1
          fi

          RESPONSE=$(curl --fail-with-body -sS -m 600 -X POST "${{ steps.get_service_url.outputs.SERVICE_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -d "$REQUEST_BODY")

          echo "Cloud Run 응답: $RESPONSE"
