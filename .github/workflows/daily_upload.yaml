name: Daily 5 Shorts Upload

on:
  schedule:
    # 매일 00시 00분 (UTC)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행을 허용

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: youtube-fully-automated
      REGION: us-central1
      IMAGE_NAME: youtube-shorts-automation
      OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
      # Cloud Run에 PORT 환경 변수를 명시적으로 전달 (선택 사항이지만 명확성을 위해)
      # Cloud Run이 기본적으로 PORT 환경 변수를 8080으로 설정하므로, 여기서는 불필요할 수 있습니다.
      # 하지만 명시적으로 8080을 설정해주는 것이 혼동을 줄일 수 있습니다.
      # PORT: 8080 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # 워크로드 아이덴티티 풀 공급자 ID는 GitHub Secrets에 저장하는 것이 좋습니다.
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com
          # 워크로드 아이덴티티 풀 설정의 '허용된 잠재고객'과 정확히 일치해야 합니다.
          # 현재 설정: https://github.com/SmileMaskL/gcp-youtube-automation
          audience: 'https://github.com/SmileMaskL/gcp-youtube-automation'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker image
        # Dockerfile이 src/ 경로에 있으므로 src/를 지정합니다.
        run: |
          gcloud builds submit src/ --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --timeout=900s \ # 컨테이너 시작 시간 제한을 900초 (15분)로 늘립니다.
            --port=8080 \    # 컨테이너가 수신 대기할 포트를 명시적으로 지정합니다.
            --set-env-vars PORT=8080 # PORT 환경 변수를 컨테이너에 전달합니다.
            # 필요한 경우 메모리 및 CPU 할당량 설정 (예: --memory=1Gi --cpu=1)
            # --max-instances=1 # 최대 인스턴스 수 제한 (비용 관리)

      - name: Trigger Cloud Run
        # Cloud Run 서비스가 성공적으로 배포된 후 해당 URL로 POST 요청을 보냅니다.
        # 이 단계는 Cloud Run 서비스가 단발성 작업을 수행하는 경우 유용합니다.
        # 만약 Cloud Run이 지속적으로 요청을 기다리는 API 서버라면 이 단계는 필요 없습니다.
        # 앱 로직에 따라 curl 요청의 Body나 Header를 추가해야 할 수도 있습니다.
        run: |
          URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run Service URL: $URL"
          # 실제 POST 요청 시 애플리케이션의 엔드포인트에 맞게 경로를 추가해야 합니다.
          # 예: curl -X POST "${URL}/process_shorts"
          curl -X POST $URL
