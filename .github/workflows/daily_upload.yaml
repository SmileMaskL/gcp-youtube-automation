name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 0시 (한국시간 9시)
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  IMAGE_NAME: youtube-shorts-automation
  # PROVIDER_RESOURCE_NAME을 env 내부에서 다른 env 변수를 참조할 때 정확한 형식으로 수정합니다.
  # env 변수는 이미 정의되어 있으므로 직접 사용 가능합니다.
  PROVIDER_RESOURCE_NAME: projects/youtube-fully-automated/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

jobs:
  deploy_and_trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          # Provider 인증에는 provider resource name을 audience로 지정합니다.
          # workload_identity_provider는 액션의 인자로 provider resource name을 직접 받습니다.
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify GCP authentication
        run: gcloud auth list

      - name: Build Docker image
        run: docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest ./src

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Push Docker image to GCR
        run: docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}

      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT" # GITHUB_OUTPUT은 ">" 대신 ">>"로 변경
          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Cloud Run URL을 가져오지 못했습니다."
            exit 1
          fi

      - name: Get ID Token for Cloud Run
        id: auth_id_token
        uses: google-github-actions/auth@v2
        with:
          token_format: 'id_token'
          # Cloud Run 호출에는 Cloud Run URL을 audience로 지정합니다.
          id_token_audience: ${{ steps.get_url.outputs.url }}
          # Workload Identity Provider 정보는 이 토큰을 발급받는 데 필요합니다.
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}

      - name: Trigger Cloud Run service
        run: |
          TOKEN="${{ steps.auth_id_token.outputs.id_token }}"
          if [ -z "$TOKEN" ]; then
            echo "❌ ID Token을 가져오지 못했습니다."
            exit 1
          fi

          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts"}' \
            "${{ env.CLOUD_RUN_SERVICE_URL }}"
