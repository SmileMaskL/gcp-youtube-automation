name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *' # 매일 0시 UTC 실행
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          workload_identity_provider: projects/1234567890/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com
          # audience는 배열 X 문자열로 설정 (v2.1.3 기준)
          audience: 'https://github.com/SmileMaskL/gcp-youtube-automation'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit --tag gcr.io/youtube-fully-automated/shorts-uploader

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy shorts-uploader \
            --image gcr.io/youtube-fully-automated/shorts-uploader \
            --platform managed \
            --region asia-northeast3 \
            --allow-unauthenticated

      - name: Trigger Shorts Upload
        run: |
          curl -X POST "https://shorts-uploader-xxxxx.a.run.app" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts", "metadata": {"topic": "긍정 명언"}}'
