name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 자정 실행
  workflow_dispatch: # 수동 실행 허용

jobs:
  upload_shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OpenID Connect (OIDC) 토큰 요청 권한: Cloud Run 호출을 위한 인증 토큰을 생성하기 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GCP credentials
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          # Workload Identity Federation (WIF) 제공자 설정 (YOUR_PROJECT_NUMBER, YOUR_POOL_NAME, YOUR_PROVIDER_NAME을 실제 값으로 변경하세요)
          # 예시: 'projects/123456789012/locations/global/workloadIdentityPools/my-wif-pool/providers/github-provider'
          # ⭐ 이 두 SECRET 값은 GitHub 저장소 Settings -> Secrets -> Actions에 정확히 설정되어 있어야 합니다.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # 이 워크플로우가 사용할 서비스 계정 이메일 (YOUR_SERVICE_ACCOUNT_EMAIL을 실제 값으로 변경하세요)
          # 예시: 'github-actions-sa@your-gcp-project-id.iam.gserviceaccount.com'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          # 추가적인 인증 설정 (필수)
          create_credentials_file: true
          export_environment_variables: true
          access_token_lifetime: 3600s # 토큰 유효 기간 (1시간)
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform # 필요한 스코프
          id_token_include_email: false # ID 토큰에 이메일 포함 여부 (보안상 false 권장)

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # STEP 1: Cloud Run 서비스의 현재 URL을 동적으로 가져오기
      - name: Get Cloud Run service URL
        id: get_service_url # 이 스텝의 출력을 'get_service_url'이라는 ID로 참조할 수 있게 합니다.
        run: |
          SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
            --platform managed \
            --region us-central1 \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }}) # 프로젝트 ID 명시
          
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Cloud Run 서비스 URL을 찾을 수 없습니다. 배포가 제대로 되었는지 확인하세요."
            exit 1
          fi
          echo "찾은 Cloud Run 서비스 URL: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT # 다음 스텝에서 이 변수를 사용할 수 있도록 출력합니다.
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # secrets에서 프로젝트 ID를 가져옵니다.

      # STEP 2: Cloud Run 서비스 호출
      - name: Call Cloud Run service
        id: call_service
        run: |
          # REQUEST_BODY를 app.py가 예상하는 형태로 구성합니다.
          REQUEST_BODY=$(cat <<EOF
          {
            "action": "create_and_upload_shorts",
            "metadata": {
              "workflow_run_id": "${{ github.run_id }}", # GitHub 워크플로우 실행 ID
              "trigger_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" # UTC 기준으로 현재 시간
            }
          }
          EOF
          )
          
          # Cloud Run 서비스에 인증된 요청을 보내기 위한 ID 토큰 생성
          # 이 토큰은 Workload Identity Federation을 통해 서비스 계정 권한을 사용합니다.
          ID_TOKEN=$(gcloud auth print-identity-token --audience=${{ steps.get_service_url.outputs.SERVICE_URL }})

          echo "::group::요청 데이터" # 요청으로 보낼 JSON 데이터를 로그에 출력 (디버깅용)
          echo "$REQUEST_BODY"
          echo "::endgroup::"
          
          # 서비스 호출 (타임아웃 600초 설정: 충분한 콜드 스타트 및 처리 시간 부여)
          # --fail-with-body: HTTP 에러 발생 시 서버 응답 본문을 출력하여 디버깅에 도움
          # -sS: 진행 상황 막대 및 오류 메시지 숨김 (깔끔한 로그를 위해)
          # -m 600: 총 요청 시간을 600초(10분)로 제한 (Cloud Run의 기본 타임아웃 5분 이상)
          RESPONSE=$(curl --fail-with-body -sS -m 600 -X POST "${{ steps.get_service_url.outputs.SERVICE_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ID_TOKEN" \ # 동적으로 얻은 ID 토큰을 사용합니다!
            -d "$REQUEST_BODY")
          
          echo "::group::서비스 응답" # Cloud Run 서비스로부터 받은 응답을 로그에 출력 (디버깅용)
          echo "$RESPONSE"
          echo "::endgroup::"
          
          # 응답 검증: Cloud Run 서비스에서 'status: "processing"'을 반환하는지 확인
          # app.py에서 'processing'을 반환하도록 되어 있으므로 'success' 조건은 제거했습니다.
          if ! echo "$RESPONSE" | jq -e '.status == "processing"' > /dev/null; then
            echo "::error::서비스 응답 실패 또는 예상치 못한 상태: $RESPONSE"
            exit 1
          fi
          
          # 작업 ID 추출 (응답에 jobId가 있다면 추출하여 다음 단계에서 사용할 수 있도록 합니다)
          JOB_ID=$(echo "$RESPONSE" | jq -r '.jobId // empty')
          if [ -n "$JOB_ID" ]; then
            echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT
            echo "✅ YouTube Shorts 업로드 요청 성공! Job ID: $JOB_ID"
          else
            echo "::warning::요청 성공했지만 Job ID를 찾을 수 없습니다. 응답: $RESPONSE"
          fi
