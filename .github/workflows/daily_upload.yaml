name: Deploy and Run Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # 매일 12PM UTC 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Set gcloud project
      run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

    # ✅ Cloud Build API 활성화 (중복 실행 무해)
    # - name: Enable Cloud Build API
      # run: gcloud services enable cloudbuild.googleapis.com

    - name: Deploy to Cloud Run
      run: |-
        gcloud run deploy youtube-shorts-automation \
          --project=${{ secrets.GCP_PROJECT_ID }} \
          --region=us-central1 \
          --source=. \
          --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest" \
          --set-secrets="OPENAI_API_KEYS=OPENAI_API_KEYS:latest" \
          --set-secrets="GCP_CREDENTIALS=GCP_CREDENTIALS:latest" \
          --memory=4Gi \
          --cpu=2 \
          --timeout=600s \
          --service-account=github-actions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
