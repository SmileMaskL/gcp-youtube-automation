name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 KST 오전 9시 실행
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  IMAGE_NAME: youtube-shorts-automation
  PROVIDER_RESOURCE_NAME: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

jobs:
  deploy_and_trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'  # OIDC 토큰 발급을 위해 필요

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🔑 1) GCP 인증
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}

      # ☁️ 2) gcloud CLI 설치
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ✅ 3) 인증된 계정 확인 (디버깅)
      - name: Verify GCP authentication
        run: gcloud auth list

      # 🛠️ 4) Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          gcloud builds submit src/ --tag gcr.io/$PROJECT_ID/$IMAGE_NAME --file src/Dockerfile

      # 🚀 5) Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}

      # ☁️ 6) Get Cloud Run Service URL
      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Error: Cloud Run service URL could not be retrieved."
            exit 1
          fi

      # 🔑 7) ID 토큰 발급 (audience = Cloud Run URL)
      - name: Get ID Token for Cloud Run
        id: auth_id_token
        uses: google-github-actions/auth@v2
        with:
          token_format: 'id_token'
          id_token_audience: ${{ steps.get_url.outputs.url }}
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}

      # 🚀 8) Trigger Cloud Run service
      - name: Trigger Cloud Run service
        run: |
          echo "🚀 Triggering Cloud Run service at ${{ env.CLOUD_RUN_SERVICE_URL }}"

          TOKEN="${{ steps.auth_id_token.outputs.id_token }}"

          if [ -z "$TOKEN" ]; then
            echo "❌ Error: ID Token could not be retrieved."
            exit 1
          fi

          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts"}' \
            "${{ env.CLOUD_RUN_SERVICE_URL }}"
