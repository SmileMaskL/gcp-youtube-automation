name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 3,7,12,18,22 * * *'  # UTC 기준 하루 5회 (3AM, 7AM, 12PM, 6PM, 10PM)
  workflow_dispatch:  # 수동 실행 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_REGION: asia-northeast3
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'  # OIDC 토큰 필수

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # 저장소 전체 히스토리 대신 최신 커밋만 체크아웃

    - name: 'Google Cloud 인증 (Workload Identity)'
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        token_format: 'access_token'  # 액세스 토큰 자동 생성
        access_token_lifetime: '600s'  # 토큰 유효기간 10분 설정

    - name: 'Google Cloud SDK 설정'
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
        export_default_credentials: true  # 기본 인증 정보 설정

    - name: 'Cloud Run 서비스 확인'
      id: service_check
      run: |
        # 서비스 상태 상세 확인
        SERVICE_INFO=$(gcloud run services describe youtube-shorts-automation \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format=json)
        
        # URL 추출
        echo "SERVICE_URL=$(echo $SERVICE_INFO | jq -r '.status.url')" >> $GITHUB_ENV
        
        # 상태 확인
        READY_STATUS=$(echo $SERVICE_INFO | jq -r '.status.conditions[] | select(.type=="Ready") | .status')
        if [ "$READY_STATUS" != "True" ]; then
          echo "::error::Cloud Run 서비스가 준비되지 않았습니다"
          echo "::group::서비스 상태"
          echo "$SERVICE_INFO" | jq .
          echo "::endgroup::"
          exit 1
        fi
        echo "✅ Cloud Run 서비스 정상 확인"

    - name: 'YouTube 쇼츠 생성 및 업로드'
      id: upload_shorts
      run: |
        # 요청 데이터 준비
        REQUEST_BODY=$(cat <<EOF
        {
          "action": "create_and_upload_shorts",
          "metadata": {
            "workflow_run_id": "${{ github.run_id }}",
            "trigger_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
        }
        EOF
        )

        echo "::group::요청 데이터"
        echo "$REQUEST_BODY"
        echo "::endgroup::"

        # 서비스 호출 (타임아웃 300초 설정)
        RESPONSE=$(curl --fail-with-body -sS -m 300 -X POST "${{ env.SERVICE_URL }}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -d "$REQUEST_BODY")

        echo "::group::서비스 응답"
        echo "$RESPONSE"
        echo "::endgroup::"

        # 응답 검증
        if ! echo "$RESPONSE" | jq -e '.status == "success"' > /dev/null; then
          echo "::error::서비스 응답 실패"
          exit 1
        fi

        # 작업 ID 추출 (있는 경우)
        JOB_ID=$(echo "$RESPONSE" | jq -r '.jobId // empty')
        if [ -n "$JOB_ID" ]; then
          echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT
        fi

    - name: '결과 로깅'
      if: always()
      run: |
        echo "=== 실행 결과 ==="
        echo "워크플로우 상태: ${{ job.status }}"
        echo "서비스 URL: ${{ env.SERVICE_URL }}"
        echo "생성된 작업 ID: ${{ steps.upload_shorts.outputs.jobId || '없음' }}"
