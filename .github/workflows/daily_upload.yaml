name: Daily 5 Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: youtube-fully-automated
      REGION: asia-northeast3
      IMAGE_NAME: youtube-shorts-automation
      OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com
          audience: 'https://github.com/SmileMaskL/gcp-youtube-automation'
          # ✅ Provider의 allowed audiences와 동일하게 지정

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker image
        run: |
          gcloud builds submit src/ --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated

      - name: Trigger Cloud Run
        run: |
          URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          curl -X POST $URL
