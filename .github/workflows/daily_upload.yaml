# .github/workflows/daily_upload.yaml
name: Daily YouTube Shorts Upload

on:
  schedule:
    # ✅ UTC 기준 매일 오전 0시 0분 (KST 오전 9시)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub UI에서 수동 실행 가능하도록

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation

jobs:
  trigger_upload_process:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation을 위해 필요

    steps:
      # ✅ 1. GitHub 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ 2. GCP 인증 먼저
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # ✅ 3. Cloud SDK 설치
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ✅ 4. Cloud Run 서비스 URL 가져오기
      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "✅ Cloud Run Service URL: $SERVICE_URL"

          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Error: Cloud Run service URL could not be retrieved."
            exit 1
          fi

      # ✅ 5. Cloud Run 서비스 트리거 (호출 시 audience 지정)
      - name: Trigger Cloud Run service
        run: |
          if [ -z "${{ env.CLOUD_RUN_SERVICE_URL }}" ]; then
            echo "❌ Error: CLOUD_RUN_SERVICE_URL is not set. Cannot trigger service."
            exit 1
          fi

          echo "🚀 Triggering Cloud Run service at ${{ env.CLOUD_RUN_SERVICE_URL }}"

          # audience는 print-identity-token에서 지정
          TOKEN=$(gcloud auth print-identity-token --audiences=${{ env.CLOUD_RUN_SERVICE_URL }})

          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts", "metadata": {"news_topic": "최신 기술 뉴스"}}' \
            ${{ env.CLOUD_RUN_SERVICE_URL }}
