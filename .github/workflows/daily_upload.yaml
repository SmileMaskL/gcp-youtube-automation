name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 기준 매일 자정 (KST 오전 9시)
  workflow_dispatch:

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  # ★★ 여기서 프로젝트 번호를 환경변수로 설정 ★★
  PROJECT_NUM: 94662874801

jobs:
  trigger_upload_process:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # ★★ 중요! PROJECT_NUM 사용하도록 수정 ★★
          workload_identity_provider: 'https://iam.googleapis.com/projects/94662874801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
          service_account: 'github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \  # 여기는 프로젝트 ID 사용
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "✅ Cloud Run Service URL: $SERVICE_URL"

      - name: Trigger Cloud Run service
        run: |
          if [ -z "${{ env.CLOUD_RUN_SERVICE_URL }}" ]; then
            echo "❌ Error: CLOUD_RUN_SERVICE_URL is empty!"
            exit 1
          fi

          echo "🚀 Triggering: ${{ env.CLOUD_RUN_SERVICE_URL }}"
          
          # ★★ 토큰 생성 시 프로젝트 ID 명시 ★★
          TOKEN=$(gcloud auth print-identity-token --project=${{ env.PROJECT_ID }})
          
          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts"}' \
            "${{ env.CLOUD_RUN_SERVICE_URL }}"
