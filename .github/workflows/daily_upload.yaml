name: Daily 5 Shorts Upload

on:
  schedule:
    # 매일 00시 00분 (UTC)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행을 허용

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation을 위해 필요

    env:
      PROJECT_ID: youtube-fully-automated
      REGION: us-central1
      IMAGE_NAME: youtube-shorts-automation
      # OPENAI_API_KEYS는 애플리케이션 내부에서 사용될 것이므로,
      # 쉘 스크립트에서 직접적으로 구문 오류를 일으킬 가능성은 낮지만,
      # 만약을 위해 secrets.OPENAI_API_KEYS 값 자체에 괄호가 있다면 주의해야 합니다.
      OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: 'auth' # ID를 추가하여 후속 단계에서 인증 상태를 참조할 수 있도록 합니다.
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Pool 공급자 ID는 GitHub Secrets에 저장하는 것이 좋습니다.
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com
          # 워크로드 아이덴티티 풀 설정의 '허용된 잠재고객'과 정확히 일치해야 합니다.
          # 현재 설정: https://github.com/SmileMaskL/gcp-youtube-automation
          audience: 'https://github.com/SmileMaskL/gcp-youtube-automation'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker image
        # Dockerfile이 src/ 경로에 있으므로 src/를 지정합니다.
        # 이미지 태그에 환경 변수를 안전하게 사용합니다.
        run: |
          gcloud builds submit src/ --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}

      - name: Deploy to Cloud Run
        # --set-env-vars에 여러 변수를 전달할 때는 콤마로 구분합니다.
        # 여기에 OPENAI_API_KEYS를 Cloud Run 컨테이너에 환경 변수로 전달합니다.
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --timeout=900s \ # 컨테이너 시작 및 요청 처리 시간 제한을 900초 (15분)로 늘립니다.
            --port=8080 \    # 컨테이너가 수신 대기할 포트를 명시적으로 지정합니다.
            --set-env-vars PORT=8080,OPENAI_API_KEYS="${{ env.OPENAI_API_KEYS }}"
            # PORT 환경 변수와 함께 OPENAI_API_KEYS 환경 변수를 컨테이너에 전달합니다.
            # OPENAI_API_KEYS 값에 특수 문자가 포함될 수 있으므로 반드시 큰따옴표로 감쌉니다.
            # 예: --memory=1Gi --cpu=1 (필요한 경우 메모리 및 CPU 할당량 설정)
            # 예: --max-instances=1 (최대 인스턴스 수 제한, 비용 관리)

      - name: Get Cloud Run Service URL
        id: get_url # 서비스 URL을 얻는 단계에 ID를 추가하여 다음 단계에서 참조할 수 있도록 합니다.
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run Service URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT" # 다음 단계에서 URL 사용을 위해 출력에 저장

      - name: Trigger Cloud Run Service
        # Cloud Run 서비스가 성공적으로 배포된 후 해당 URL로 POST 요청을 보냅니다.
        # 이 단계는 Cloud Run 서비스가 단발성 작업을 수행하는 경우 유용합니다.
        # 만약 Cloud Run이 지속적으로 요청을 기다리는 API 서버라면,
        # 외부에서 이 서비스를 호출하는 방법을 고려해야 하며 이 단계는 필요 없을 수 있습니다.
        # 앱 로직에 따라 curl 요청의 Body나 Header를 추가해야 할 수도 있습니다.
        run: |
          # 이전 단계에서 저장된 service_url 값을 가져옵니다.
          URL="${{ steps.get_url.outputs.service_url }}"
          if [ -z "$URL" ]; then
            echo "Error: Cloud Run Service URL not found."
            exit 1
          fi
          echo "Attempting to trigger Cloud Run Service at: $URL"
          # 실제 POST 요청 시 애플리케이션의 엔드포인트에 맞게 경로를 추가해야 합니다.
          # 예: curl -X POST "${URL}/process_shorts"
          # 만약 서비스가 무인증을 허용하지 않는다면, 인증 헤더를 추가해야 합니다.
          curl -X POST "$URL"
