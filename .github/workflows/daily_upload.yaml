# .github/workflows/daily_upload.yaml

name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 기준 매일 자정 (KST 오전 9시)
  workflow_dispatch: # 수동 실행을 위한 트리거

env:
  PROJECT_ID: youtube-fully-automated
  GCP_REGION: us-central1
  SERVICE_NAME: youtube-shorts-automation
  PROVIDER_RESOURCE_NAME: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

jobs:
  trigger_upload_process:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation (OIDC) 토큰 생성을 위해 필요

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 🔑 GCP 인증 ---
      # gcloud CLI를 위한 Access Token을 요청합니다.
      # Cloud Run 호출에 필요한 ID 토큰은 gcloud auth print-identity-token으로 나중에 생성합니다.
      - name: Authenticate to Google Cloud
        id: auth # ID는 auth로 유지합니다.
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token' # <--- 이 라인이 'access_token'으로 다시 변경되었습니다!
          workload_identity_provider: ${{ env.PROVIDER_RESOURCE_NAME }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          # audience 파라미터는 여기에서 다시 제거합니다.
          # gcloud auth print-identity-token이 ID 토큰의 audience를 처리할 것입니다.

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        # Authenticate step에서 받은 인증 정보가 여기에 자동으로 적용됩니다.

      # --- ☁️ Cloud Run 서비스 URL 가져오기 ---
      - name: Get Cloud Run Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "✅ Cloud Run Service URL: $SERVICE_URL"

          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Error: Cloud Run service URL could not be retrieved."
            exit 1
          fi

      # --- 🚀 Cloud Run 서비스 트리거 ---
      # Cloud Run 서비스 호출을 위한 ID 토큰은 gcloud auth print-identity-token으로 다시 생성합니다.
      - name: Trigger Cloud Run service
        run: |
          if [ -z "${{ env.CLOUD_RUN_SERVICE_URL }}" ]; then
            echo "❌ Error: CLOUD_RUN_SERVICE_URL is not set. Cannot trigger service."
            exit 1
          fi

          echo "🚀 Triggering Cloud Run service at ${{ env.CLOUD_RUN_SERVICE_URL }}"

          # gcloud CLI가 올바른 서비스 계정을 사용하도록 명시적으로 설정 (이전처럼)
          gcloud config set account ${{ env.SERVICE_ACCOUNT_EMAIL }}

          # Cloud Run 서비스 호출을 위한 ID 토큰을 생성합니다.
          # 이 토큰의 audience는 Cloud Run 서비스의 URL이어야 합니다.
          TOKEN=$(gcloud auth print-identity-token --audiences=${{ env.CLOUD_RUN_SERVICE_URL }}) # <--- 이 라인이 다시 추가되었습니다!

          echo "✅ Generated Identity Token for Cloud Run service."

          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts"}' \
            "${{ env.CLOUD_RUN_SERVICE_URL }}"
