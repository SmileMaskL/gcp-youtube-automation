name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 3,7,12,18,22 * * *'  # 하루 5회 실행 (UTC 기준)
  workflow_dispatch: # 수동 실행 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }} # << GCP_PROJECT_NUMBER도 env에 추가 (deploy-and-run.yml과 통일)
  GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
  GCP_REGION: asia-northeast3 # << deploy-and-run.yml과 통일 (필요 시 us-central1 유지)
  GH_REPOSITORY_OWNER: SmileMaskL
  GH_REPOSITORY_NAME: gcp-youtube-automation
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com # << 서비스 계정 이메일 env에 추가

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      actions: 'write'  # GitHub Actions 권한 추가
      id-token: 'write'  # OIDC 토큰 발급 필수

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 'Authenticate to Google Cloud'
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        # Workload Identity Provider 경로를 deploy-and-run.yml과 동일하게 정확히 명시
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }} # << env 변수 사용으로 통일
        audience: "https://iam.googleapis.com/projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01"

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }} # setup-gcloud에도 프로젝트 ID를 전달합니다.

    - name: Configure Docker for Google Container Registry
      run: gcloud auth configure-docker

    - name: Build and Deploy Cloud Run Service
      id: deploy_cloud_run
      run: |
        gcloud run deploy youtube-shorts-automation \
          --source ./src \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --service-account ${{ env.SERVICE_ACCOUNT_EMAIL }} \
          --set-env-vars \
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},\
            GCP_BUCKET_NAME=${{ env.GCP_BUCKET_NAME }},\
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }},\
            ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }},\
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
            NEWS_API_KEY=${{ secrets.NEWS_API_KEY }},\
            OPENAI_API_KEYS="${{ secrets.OPENAI_API_KEYS }}",\ # << 큰따옴표 추가
            PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }},\
            YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }},\
            YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }},\
            YOUTUBE_REFRESH_TOKEN="${{ secrets.YOUTUBE_REFRESH_TOKEN }}" # << 큰따옴표 추가
        
        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
                      --platform managed \
                      --region ${{ env.GCP_REGION }} \
                      --format="value(status.url)")
        
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

    - name: Invoke Cloud Run Service
      run: |
        CALL_TOKEN=$(gcloud auth print-identity-token)
        curl -X POST "${{ env.SERVICE_URL }}" \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer $CALL_TOKEN" \
             -d '{"action": "create_and_upload_shorts"}'
