name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 3,7,12,18,22 * * *'  # UTC 기준 하루 5회 실행 (3AM, 7AM, 12PM, 6PM, 10PM)
  workflow_dispatch:  # 수동 실행 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_REGION: asia-northeast3  # Cloud Run 서비스가 배포된 리전
  SERVICE_ACCOUNT_EMAIL: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 최대 실행 시간 설정
    permissions:
      contents: 'read'
      id-token: 'write'  # OIDC 토큰 발급 필수

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # 저장소 전체 히스토리 대신 최신 커밋만 체크아웃

    - name: 'Google Cloud 인증 (Workload Identity Federation)'
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01"
        service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        token_format: 'access_token'  # 액세스 토큰 자동 생성
        access_token_lifetime: '600s'  # 토큰 유효기간 10분 설정

    - name: 'Google Cloud SDK 설정'
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
        export_default_credentials: true  # 기본 인증 정보 설정

    - name: 'Cloud Run 서비스 정보 조회'
      id: get_service_url
      run: |
        # Cloud Run 서비스 URL 조회
        SERVICE_URL=$(gcloud run services describe youtube-shorts-automation \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format="value(status.url)")
        
        # 서비스 상태 확인
        SERVICE_STATUS=$(gcloud run services describe youtube-shorts-automation \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format="value(status.conditions[0].status)")
        
        if [ "$SERVICE_STATUS" != "True" ]; then
          echo "::error::Cloud Run 서비스가 정상 상태가 아닙니다: $SERVICE_STATUS"
          exit 1
        fi

        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
        echo "Cloud Run 서비스 URL: $SERVICE_URL"

    - name: 'YouTube 쇼츠 생성 및 업로드 요청'
      run: |
        # 요청 본문 데이터 준비
        REQUEST_BODY=$(cat <<EOF
        {
          "action": "create_and_upload_shorts",
          "metadata": {
            "workflow_run_id": "${{ github.run_id }}",
            "trigger_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
        }
        EOF
        )

        # Cloud Run 서비스 호출
        RESPONSE=$(curl -sS -X POST "${{ env.SERVICE_URL }}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -d "$REQUEST_BODY")

        # 응답 처리
        echo "서비스 응답: $RESPONSE"
        
        # 응답에서 작업 ID 추출 (필요시)
        JOB_ID=$(echo "$RESPONSE" | jq -r '.jobId // empty')
        if [ -n "$JOB_ID" ]; then
          echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT
        fi

      # 오류 발생 시 자동 재시도 (최대 3회)
      retry-on-error: true
      max-attempts: 3

    - name: '작업 결과 확인'
      if: always()
      run: |
        echo "워크플로우 실행 완료: ${{ job.status }}"
        echo "서비스 URL: ${{ env.SERVICE_URL }}"
        echo "최종 응답: $RESPONSE"
