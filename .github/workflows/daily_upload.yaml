name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: '0 0 * * *' # 매일 0시 UTC 실행
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env: # 환경 변수 추가
      PROJECT_ID: youtube-fully-automated
      PROJECT_NUMBER: 94662874801 # Workload Identity Provider에서 추출한 프로젝트 번호
      REGION: us-central1
      REPOSITORY: youtube-shorts-automation-repo
      IMAGE_NAME: youtube-shorts-automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          # PROJECT_NUMBER 환경 변수 사용 (하드코딩된 값 대신)
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool-new/providers/github-provider"
          service_account: github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com
          audience: 'https://github.com/SmileMaskL/gcp-youtube-automation'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          # Artifact Registry 도메인에 Docker 인증 구성
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          # 환경 변수를 사용하여 이미지 태그 구성 및 현재 디렉토리(.)에서 Dockerfile 빌드
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}

      - name: Deploy to Cloud Run
        run: |
          # 환경 변수를 사용하여 Cloud Run 서비스 이름 및 이미지 경로 변경
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated # 필요에 따라 인증 설정 변경 가능

      - name: Trigger Shorts Upload
        run: |
          # 환경 변수를 사용하여 Cloud Run 서비스 URL 구성
          # Cloud Run URL 형식: https://SERVICE_NAME-PROJECT_NUMBER.REGION.run.app
          CLOUD_RUN_URL="https://${{ env.IMAGE_NAME }}-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app"
          echo "Cloud Run URL: $CLOUD_RUN_URL"
          curl -X POST "$CLOUD_RUN_URL" \
            -H "Content-Type: application/json" \
            -d '{"action": "create_and_upload_shorts", "metadata": {"topic": "긍정 명언"}}'
