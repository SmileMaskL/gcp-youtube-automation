name: Daily YouTube Shorts Upload

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 0시)에 실행
    # 0 0 * * *는 UTC 기준이므로, 한국 시간 오전 9시 = UTC 자정 (00:00)입니다.
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행을 허용

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE_NAME: youtube-shorts-automation # Cloud Run 서비스 이름

jobs:
  run-shorts-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC를 통해 GCP에 인증하기 위한 권한

    steps:
    - name: 'Google Cloud 인증'
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider-01'
        service_account: 'github-actions-sa@youtube-fully-automated.iam.gserviceaccount.com'

    - name: 'gcloud CLI 설치 및 구성'
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: '인증된 계정 확인'
      run: |
        echo "현재 인증된 계정: $(gcloud auth list --filter="status:ACTIVE" --format="value(account)")"
        echo "현재 활성 프로젝트: $(gcloud config get-value project)"

    - name: 'Cloud Run 서비스 URL 가져오기'
      id: get_service_url
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --format='value(status.url)')
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
        echo "Cloud Run Service URL: $SERVICE_URL"

    - name: 'YouTube 쇼츠 생성 및 업로드'
      run: |
        if [ -z "${{ env.SERVICE_URL }}" ]; then
          echo "::error::Cloud Run 서비스 URL을 찾을 수 없습니다. 배포가 제대로 되었는지 확인하세요."
          exit 1
        fi

        # ✅ 여기! REQUEST_BODY를 app.py가 예상하는 형태로 수정합니다.
        # "action" 키와 "metadata" 키를 포함하도록 변경합니다.
        REQUEST_BODY=$(cat <<EOF
        {
          "action": "create_and_upload_shorts",
          "metadata": {
            "workflow_run_id": "${{ github.run_id }}",
            "trigger_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
        }
        EOF
        )

        echo "::group::요청 데이터"
        echo "$REQUEST_BODY"
        echo "::endgroup::"

        # 서비스 호출 (타임아웃 300초 설정)
        RESPONSE=$(curl --fail-with-body -sS -m 300 -X POST "${{ env.SERVICE_URL }}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $(gcloud auth print-identity-token --audiences=${{ env.SERVICE_URL }})" \
          -d "$REQUEST_BODY")

        echo "::group::서비스 응답"
        echo "$RESPONSE"
        echo "::endgroup::"

        # 응답 검증: Cloud Run 서비스에서 'status: "success"' 또는 'status: "processing"'을 반환하는지 확인
        if ! echo "$RESPONSE" | jq -e '.status == "success" or .status == "processing"' > /dev/null; then
          echo "::error::서비스 응답 실패 또는 예상치 못한 상태: $RESPONSE"
          exit 1
        fi

        # 작업 ID 추출 (있는 경우)
        JOB_ID=$(echo "$RESPONSE" | jq -r '.jobId // empty')
        if [ -n "$JOB_ID" ]; then
          echo "jobId=$JOB_ID" >> $GITHUB_OUTPUT
        fi
